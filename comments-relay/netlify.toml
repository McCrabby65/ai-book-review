# Netlify settings for the reader-comments relay.
# In Netlify, set "Base directory" to comments-relay so only this folder is deployed.
[build]
  publish = "public"
  functions = "netlify/functions"
  # Skip a rebuild unless something in this folder changed
  # (new comments and book edits don't need one).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."
